<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirada de EPI</title>

<style>
:root {
  --bg: #eef2f6;
  --card: #ffffff;
  --text: #111;
  --primary: #1e88e5;
}

body.dark {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
}

body {
  margin: 0;
  font-family: Arial;
  background: var(--bg);
  color: var(--text);
  transition: 0.3s;
}

.app {
  max-width: 420px;
  margin: auto;
  padding: 15px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 10px 0 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: bold;
}

/* 🔥 LOGO DOBRADA */
.logo img {
  width: 130px;   /* antes 65px → DOBRADO */
  height: 130px;
  object-fit: contain;
}

.toggle {
  cursor: pointer;
  font-size: 14px;
}

/* CARD */
.card {
  background: var(--card);
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 10px;
}

/* 🔥 MATRÍCULA MAIS LARGA */
input {
  width: 95%;   /* antes 85% → aumentado */
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 14px;
}

/* GRID */
.epi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 10px;
}

.epi {
  background: var(--card);
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 10px;
  text-align: center;
  cursor: pointer;
  font-size: 13px;
}

.epi img {
  width: 60px;
  height: 60px;
}

/* CARRINHO */
.item {
  border: 1px solid #ddd;
  padding: 10px;
  border-radius: 10px;
  margin-top: 8px;
  position: relative;
}

.remove {
  position: absolute;
  top: 5px;
  right: 8px;
  cursor: pointer;
  color: red;
  font-weight: bold;
}

/* INPUTS */
select,
input[type="number"] {
  width: 100%;
  padding: 6px;
  font-size: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

/* BOTÃO */
button {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 12px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">
      <img src="imagens/logo_csn.png">
      EPI System
    </div>
    <div class="toggle" onclick="toggleDark()">🌙</div>
  </div>

  <!-- MATRÍCULA -->
  <div class="card">
    <input id="matricula" placeholder="Matrícula (ex: CSP7815)">
  </div>

  <!-- CATÁLOGO -->
  <div class="card">
    <b>EPIs</b>

    <div class="epi-grid">

      <div class="epi" onclick="add('Luva')">
        <img src="imagens/Luva de Proteção Térmica.png"><br>
        Luva
      </div>

      <div class="epi" onclick="add('Capacete')">
        <img src="imagens/Capacete cinza.jfif"><br>
        Capacete
      </div>

      <div class="epi" onclick="add('Óculos')">
        <img src="imagens/Óculos Uvex Aerospec 3000.jfif"><br>
        Óculos
      </div>

      <div class="epi" onclick="add('Botina')">
        <img src="imagens/Bota Eletricista.png"><br>
        Botina
      </div>

    </div>
  </div>

  <!-- CARRINHO -->
  <div class="card">
    <b>Solicitação</b>
    <div id="carrinho"></div>
  </div>

  <button onclick="enviar()">ENVIAR</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "SUA_API",
  authDomain: "teste-api-70d67.firebaseapp.com",
  projectId: "teste-api-70d67",
  storageBucket: "teste-api-70d67.firebasestorage.app",
  messagingSenderId: "269358394096",
  appId: "1:269358394096:web:02ef771a437d062174b035"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let pedido = [];

/* DARK MODE */
window.toggleDark = function () {
  document.body.classList.toggle("dark");
};

/* ADD EPI */
window.add = function(epi){
  pedido.push({
    epi,
    tamanho: "M",
    quantidade: 1
  });
  render();
};

/* REMOVE ITEM */
window.removeItem = function(index){
  pedido.splice(index,1);
  render();
};

/* RENDER */
function render(){
  let html = "";

  pedido.forEach((p,i)=>{
    html += `
      <div class="item">
        <div class="remove" onclick="removeItem(${i})">✖</div>

        <b>${p.epi}</b>

        <select onchange="pedido[${i}].tamanho=this.value">
          <option>P</option>
          <option>M</option>
          <option>G</option>
          <option>GG</option>
        </select>

        <input type="number" min="1" value="${p.quantidade}"
        onchange="pedido[${i}].quantidade=this.value">
      </div>
    `;
  });

  document.getElementById("carrinho").innerHTML = html;
}

window.render = render;

/* ENVIAR */
window.enviar = async function () {
  const matricula = document.getElementById("matricula").value;

  if (!matricula || pedido.length === 0) {
    alert("Preencha tudo!");
    return;
  }

  await addDoc(collection(db,"pedidos"),{
    matricula,
    itens: pedido,
    status: "pendente",
    data: new Date().toISOString()
  });

  alert("Enviado!");
  location.reload();
};
</script>

</body>
</html>
